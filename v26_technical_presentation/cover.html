<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  body { margin:0; }
  .slide-container { width:1280px; min-height:700px; box-sizing:border-box; background:#0b1830; color:#f5f9ff; font-family:Tahoma, Arial, sans-serif; position:relative; overflow:hidden; }
  .eyebrow { color:#58d3c8; font-size:20px; letter-spacing:1px; font-weight:700; }
  .title { font-size:58px; line-height:1.25; font-weight:800; margin:20px 0; }
  .subtitle { font-size:25px; line-height:1.7; color:#c4d1e2; max-width:650px; }
  .audience { font-size:17px; color:#8fa5c2; margin-top:28px; }
  .content { position:relative; z-index:2; padding-top:142px; padding-right:100px; }
  .version { position:absolute; top:64px; left:100px; color:#58d3c8; font-size:22px; font-weight:700; border:1px solid #58d3c8; padding:10px 18px; }
  .motif { position:absolute; left:130px; bottom:90px; width:360px; height:360px; border:1px solid rgba(88,211,200,.42); transform:rotate(45deg); }
  .motif:before, .motif:after { content:""; position:absolute; border:1px solid rgba(88,211,200,.25); }
  .motif:before { width:245px; height:245px; top:56px; left:56px; }
  .motif:after { width:125px; height:125px; top:115px; left:115px; background:rgba(88,211,200,.08); }
  .line { position:absolute; left:0; top:0; width:7px; min-height:700px; background:#58d3c8; }
  .footer { position:absolute; right:100px; bottom:52px; color:#7890af; font-size:15px; }
</style>
</head>
<body>
<div class="slide-container">
  <div class="line"></div>
  <div class="version">v2.6.0</div>
  <div class="motif"></div>
  <div class="content">
    <div class="eyebrow">FINANALYZER ENTERPRISE</div>
    <div class="title">کنترل مالی<br>قابل‌راستی‌آزمایی</div>
    <div class="subtitle">امنیت سازمانی، بستن دوره کنترل‌شده و شواهد انطباقی برای عملیات مالی حساس</div>
    <div class="audience">ارائه فنی برای هیئت‌مدیره، مدیر مالی، امنیت و فناوری اطلاعات</div>
  </div>
  <div class="footer">Technical Product Briefing</div>
</div>
</body>
</html>
