<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    html,body{margin:0;padding:0}
    .slide-container{width:1280px;min-height:720px;margin-top:-1px;box-sizing:border-box;background:#04111f;color:#f4f8fb;font-family:Tahoma,Arial,sans-serif;position:relative;}
    .content{box-sizing:border-box;padding-top:72px;padding-right:76px;padding-left:76px;display:flex;align-items:center;justify-content:space-between;direction:rtl}
    .left{width:710px;position:relative;z-index:2}
    .eyebrow{color:#41d7ca;font-size:18px;letter-spacing:1px;margin-bottom:18px}
    h1{font-size:52px;line-height:1.28;margin:0 0 12px 0;font-weight:700}
    .bar{width:110px;height:5px;background:#41d7ca;margin:12px 0}
    p{font-size:24px;line-height:1.65;color:#b8c9d8;margin:0}
    .badge{width:300px;height:300px;border:2px solid #1e5361;display:flex;align-items:center;justify-content:center;transform:rotate(45deg);margin-left:70px}
    .badge-inner{width:214px;height:214px;border:2px solid #41d7ca;display:flex;align-items:center;justify-content:center;transform:rotate(-45deg);background:#09263a}
    .footer-right{position:absolute;right:76px;bottom:46px;color:#7f9cab;font-size:16px}
    .footer-left{position:absolute;left:76px;bottom:46px;color:#41d7ca;font-size:15px}
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="content">
      <div class="left">
        <div class="eyebrow">FINANALYZER ENTERPRISE</div>
        <h1>نسخه ۲.۵.۰<br>امنیت قابل‌راستی‌آزمایی</h1>
        <div class="bar"></div>
        <p>ثبت ممیزی زنجیره‌ای، انتشار Windows امضاشده<br>و کنترل بستن دوره مالی</p>
      </div>
      <div class="badge">
        <div class="badge-inner">
          <div style="text-align:center;">
            <i class="fas fa-shield-halved" style="font-size:76px;color:#41d7ca"></i>
            <div style="font-size:16px;color:#dcecf1;margin-top:17px;letter-spacing:2px">TRUSTED FINANCE</div>
          </div>
        </div>
      </div>
    </div>
    <div class="footer-right">ارائه فنی برای فناوری، امنیت و مالی سازمانی</div>
    <div class="footer-left">RELEASE BRIEF · 2026</div>
  </div>
</body>
</html>
